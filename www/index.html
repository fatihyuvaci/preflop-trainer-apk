<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fatih Preflop Trainer</title>
<style>
  :root {
    --bg-dark: #0b1120;
    --panel-bg: #1e293b;
    --panel-border: #334155;
    --felt-green: #14532d;
    --felt-inner: #166534;
    --color-allin: #f28b82;
    --color-raise: #e61919;
    --color-call: #18181b;
    --color-fold: #8c9095;
    --color-unused: #ffffff;
    --accent-gold: #fbbf24;
    --accent-blue: #38bdf8;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 8px;
    overflow-x: hidden;
  }

  @media (min-width: 981px) {
    body {
      height: 100vh;
      padding: 10px 16px;
      overflow: hidden;
    }
  }

  /* TOP BAR: TITLE + DRILL MODE + SCORE */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-bg);
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    margin-bottom: 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 8px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand h1 {
    font-size: 0.98rem;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: #fff;
  }

  .controls-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stats-reset-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
  }

  .mode-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .mode-select {
    background: var(--bg-dark);
    color: #fff;
    border: 1px solid #475569;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 0.74rem;
    font-weight: 600;
    cursor: pointer;
    max-width: 100%;
  }

  .two-step-btn {
    background: var(--bg-dark);
    color: #cbd5e1;
    border: 1px solid #475569;
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 0.74rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .two-step-btn:hover {
    border-color: #94a3b8;
    color: #fff;
  }

  .two-step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #64748b;
    transition: all 0.15s ease;
  }

  .two-step-btn.active {
    background: rgba(251, 191, 36, 0.16);
    border-color: var(--accent-gold);
    color: var(--accent-gold);
    box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.25);
  }

  .two-step-btn.active .two-step-dot {
    background: var(--accent-gold);
    box-shadow: 0 0 7px rgba(251, 191, 36, 0.85);
  }

  .stats-pill {
    background: var(--bg-dark);
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 0.76rem;
    font-weight: 700;
    border: 1px solid var(--panel-border);
    display: flex;
    gap: 10px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .stats-pill:hover {
    border-color: #64748b;
    background: #111a2e;
  }

  .reset-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid #475569;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  @media (max-width: 980px) {
    .top-bar {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .controls-bar {
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      gap: 8px;
    }

    .stats-reset-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      max-width: 100%;
    }
  }

  .reset-btn:hover {
    color: #fff;
    border-color: #94a3b8;
  }

  /* MAIN WORKSPACE GRID */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1.12fr;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  @media (max-width: 980px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
  }

  /* LEFT PANEL: POKER TABLE */
  .table-panel {
    background: var(--panel-bg);
    border-radius: 12px;
    padding: 12px;
    border: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    min-height: 0;
  }

  /* INTERACTIVE DROPDOWN SCENARIO BADGES */
  .scenario-badges {
    display: grid;
    grid-template-columns: 1fr 0.85fr 1.45fr;
    gap: 8px;
    position: relative;
    z-index: 50;
  }

  .badge-dropdown-wrap {
    position: relative;
    min-width: 0;
  }

  .badge-card {
    width: 100%;
    background: var(--bg-dark);
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    padding: 7px 10px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .badge-card:hover {
    border-color: #64748b;
    background: #111a2e;
  }

  .badge-dropdown-wrap.open .badge-card {
    border-color: var(--accent-gold);
    box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
  }

  .badge-dropdown-wrap.stack-wrap.open .badge-card {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
  }

  .badge-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }

  .badge-label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-muted);
    font-weight: 700;
  }

  .mix-mini-pill {
    font-size: 0.56rem;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(251, 191, 36, 0.16);
    color: var(--accent-gold);
    border: 1px solid rgba(251, 191, 36, 0.35);
    display: none;
    white-space: nowrap;
  }

  .mix-mini-pill.visible {
    display: inline-block;
  }

  .badge-value-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .badge-value {
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--accent-gold);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge-value.stack-highlight {
    color: var(--accent-blue);
  }

  .badge-chevron {
    font-size: 0.72rem;
    color: var(--text-muted);
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }

  .badge-dropdown-wrap.open .badge-chevron {
    transform: rotate(180deg);
    color: #fff;
  }

  /* DROPDOWN POPOVER MENU */
  .badge-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 100%;
    width: max-content;
    max-width: min(320px, 92vw);
    max-height: 360px;
    overflow-y: auto;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 10px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 3px;
    z-index: 200;
  }

  .badge-dropdown-wrap.spot-wrap .badge-menu {
    right: 0;
    left: auto;
  }

  .badge-dropdown-wrap.open .badge-menu {
    display: flex;
  }

  .menu-option {
    background: transparent;
    border: 1px solid transparent;
    color: #e2e8f0;
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 0.78rem;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    transition: all 0.12s;
  }

  .menu-option:hover {
    background: #1e293b;
    color: #fff;
  }

  .menu-option.active {
    background: rgba(251, 191, 36, 0.15);
    color: var(--accent-gold);
    border-color: rgba(251, 191, 36, 0.4);
  }

  .stack-wrap .menu-option.active {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent-blue);
    border-color: rgba(56, 189, 248, 0.4);
  }

  .menu-option-tag {
    font-size: 0.64rem;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 5px;
    background: #1e293b;
    color: #94a3b8;
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    .scenario-badges {
      grid-template-columns: 1fr 0.8fr 1.35fr;
      gap: 6px;
    }
    .badge-card {
      padding: 6px 7px;
    }
    .badge-value {
      font-size: 0.78rem;
    }
  }

  .poker-felt {
    position: relative;
    background: radial-gradient(circle, var(--felt-inner) 0%, var(--felt-green) 75%, #064e3b 100%);
    border: 6px solid #3f2e21;
    box-shadow: inset 0 0 28px rgba(0,0,0,0.6), 0 5px 14px rgba(0,0,0,0.38);
    border-radius: 56px;
    flex: 1;
    min-height: 295px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 20px 88px 20px;
  }

  .action-history-banner {
    background: rgba(0, 0, 0, 0.6);
    padding: 6px 14px;
    border-radius: 18px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #f8fafc;
    border: 1px solid rgba(251, 191, 36, 0.35);
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .action-history-banner.step2-active {
    border-color: var(--accent-blue);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
  }

  @keyframes stepBannerPulse {
    0% { transform: scale(0.97); box-shadow: 0 0 0 rgba(56, 189, 248, 0); }
    50% { transform: scale(1.02); box-shadow: 0 0 18px rgba(56, 189, 248, 0.6); }
    100% { transform: scale(1); box-shadow: 0 0 14px rgba(56, 189, 248, 0.35); }
  }

  .action-history-banner.step-pulse {
    animation: stepBannerPulse 0.32s ease;
  }

  .step-pill {
    font-size: 0.64rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border-radius: 999px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .step-pill.step-1 {
    background: rgba(251, 191, 36, 0.2);
    color: var(--accent-gold);
    border: 1px solid rgba(251, 191, 36, 0.5);
  }

  .step-pill.step-2 {
    background: rgba(56, 189, 248, 0.22);
    color: var(--accent-blue);
    border: 1px solid rgba(56, 189, 248, 0.6);
  }

  .hero-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
  }

  .cards-container {
    display: flex;
    gap: 11px;
  }

  .playing-card {
    width: 78px;
    height: 108px;
    background: #ffffff;
    border-radius: 9px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 7px;
    border: 2px solid #e2e8f0;
  }

  .playing-card .corner-rank {
    font-size: 1.3rem;
    font-weight: 900;
    line-height: 1;
  }

  .playing-card .center-suit {
    font-size: 2.2rem;
    align-self: center;
    line-height: 1;
  }

  .playing-card .bottom-rank {
    font-size: 0.98rem;
    font-weight: 800;
    align-self: flex-end;
    line-height: 1;
  }

  .suit-spades { color: #0f172a; }
  .suit-hearts { color: #dc2626; }
  .suit-diamonds { color: #2563eb; }
  .suit-clubs { color: #15803d; }

  .hand-notation-badge {
    background: var(--bg-dark);
    color: #fff;
    padding: 2px 15px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 0.88rem;
    border: 2px solid var(--accent-gold);
  }

  /* FEEDBACK BOX (Anchored at bottom inside poker table - zero layout shift) */
  .feedback-box {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 12px;
    max-width: 520px;
    margin: 0 auto;
    min-height: 58px;
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(11, 17, 32, 0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1.5px solid var(--panel-border);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    gap: 8px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.14s ease;
    z-index: 15;
  }

  .feedback-box.correct {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    background: rgba(9, 44, 26, 0.94);
    border-color: #22c55e;
  }

  .feedback-box.wrong {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    background: rgba(60, 14, 18, 0.94);
    border-color: #ef4444;
  }

  .feedback-left {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    flex: 1;
  }

  .feedback-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 900;
    flex-shrink: 0;
  }

  .icon-neutral { background: #1e293b; color: #64748b; }
  .icon-correct { background: #22c55e; color: #052e16; }
  .icon-wrong { background: #ef4444; color: #fff; }

  .feedback-text {
    min-width: 0;
  }

  .feedback-text h3 {
    font-size: 0.84rem;
    font-weight: 800;
    line-height: 1.2;
  }

  .feedback-text p {
    font-size: 0.72rem;
    color: #e2e8f0;
    margin-top: 2px;
    line-height: 1.25;
  }

  .next-btn {
    background: var(--accent-gold);
    color: #0f172a;
    border: none;
    padding: 9px 14px;
    border-radius: 8px;
    font-weight: 900;
    font-size: 0.78rem;
    cursor: pointer;
    display: none;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  }

  @media (max-width: 600px) {
    .poker-felt {
      border-radius: 36px;
      min-height: 280px;
      padding: 14px 12px 86px 12px;
    }
    .feedback-box {
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 7px 10px;
      min-height: 54px;
    }
    .feedback-icon {
      width: 30px;
      height: 30px;
      font-size: 1.05rem;
    }
    .feedback-text h3 {
      font-size: 0.78rem;
    }
    .feedback-text p {
      font-size: 0.69rem;
    }
    .next-btn {
      padding: 8px 11px;
      font-size: 0.74rem;
    }
  }

  /* ACTION BUTTONS */
  .action-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
    gap: 8px;
  }

  .act-btn {
    border: none;
    border-radius: 10px;
    padding: 13px 6px;
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.1s ease;
  }

  .act-btn:active { transform: translateY(2px); }
  .act-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-fold { background: #64748b; border-bottom: 4px solid #475569; }
  .btn-call { background: #18181b; border-bottom: 4px solid #09090b; border-top: 1px solid #3f3f46; }
  .btn-raise { background: #e61919; border-bottom: 4px solid #991b1b; }
  .btn-allin { background: #f28b82; color: #0f172a; border-bottom: 4px solid #e11d48; }

  .act-btn .act-title {
    font-size: 0.88rem;
    font-weight: 900;
  }

  .act-btn .act-sub {
    font-size: 0.66rem;
    opacity: 0.85;
    font-weight: 600;
  }

  /* RIGHT PANEL: 13x13 MATRIX */
  .chart-panel {
    background: var(--panel-bg);
    border-radius: 12px;
    padding: 12px;
    border: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 0;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chart-title-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chart-title {
    font-size: 0.86rem;
    font-weight: 800;
  }

  .chart-step-tabs {
    display: none;
    align-items: center;
    background: var(--bg-dark);
    border: 1px solid var(--panel-border);
    border-radius: 7px;
    padding: 2px;
    gap: 2px;
  }

  .chart-step-tabs.visible {
    display: inline-flex;
  }

  .chart-step-tab {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 0.69rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.14s ease;
    white-space: nowrap;
  }

  .chart-step-tab:hover {
    color: #fff;
  }

  .chart-step-tab.active {
    background: #334155;
    color: #fff;
  }

  .chart-step-tab.tab-ok.active {
    background: rgba(34, 197, 94, 0.22);
    color: #4ade80;
  }

  .chart-step-tab.tab-err.active {
    background: rgba(239, 68, 68, 0.25);
    color: #f87171;
  }

  .legend {
    display: flex;
    gap: 8px;
    font-size: 0.72rem;
    font-weight: 700;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .legend-swatch {
    width: 11px;
    height: 11px;
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .matrix-wrapper {
    position: relative;
    width: 100%;
    max-width: 520px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border: 2px solid var(--bg-dark);
    border-radius: 6px;
    overflow: hidden;
  }

  @media (min-width: 981px) {
    .matrix-wrapper {
      max-height: calc(100vh - 185px);
    }
  }

  .matrix-grid {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    grid-template-rows: repeat(13, 1fr);
    width: 100%;
    height: 100%;
    background: #475569;
    gap: 1px;
  }

  .matrix-cell {
    position: relative;
    background: var(--color-fold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.48rem, 2.1vw, 0.74rem);
    font-weight: 700;
    color: #f8fafc;
    text-shadow: 0 1px 2px rgba(0,0,0,0.95);
    overflow: hidden;
  }

  .matrix-cell.unused-cell {
    background: #ffffff;
    color: transparent;
    text-shadow: none;
  }

  .cell-bars {
    position: absolute;
    inset: 0;
    display: flex;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .bar-allin { background: var(--color-allin); height: 100%; }
  .bar-raise { background: var(--color-raise); height: 100%; }
  .bar-call  { background: var(--color-call); height: 100%; }
  .bar-fold  { background: var(--color-fold); height: 100%; }

  .matrix-cell span {
    position: relative;
    z-index: 2;
  }

  .matrix-cell.active-hand {
    outline: 3px solid var(--accent-gold);

      ],

        { id: 'bb_60_vs_sb_limp_raise', label: '21. BB vs Limp-Raise',   tag: '60bb' },

        { id: 'mix_60_hj',  label: '🎲 Mix LJ/HJ (60bb)',    tag: '4 Charts' },
        { id: 'mix_60_bn',  label: '🎲 Mix CO/BN (60bb)',    tag: '4 Charts' },
        { id: 'mix_60_sb',  label: '🎲 Mix SB (60bb)',       tag: '5 Charts' },
        { id: 'mix_60_bb',  label: '🎲 Mix BB (60bb)',       tag: '6 Charts' }
      ]
    }
  };

  // ============================================================================
  // 2-STEP CHAIN DEFINITIONS (37 CHAINS ACROSS 15, 25, 40 & 60BB)
  // ============================================================================
  const STEP_CHAINS = {
    // 15bb (5 chains)
    utg_15_open:       { label: 'UTG Open → vs All-in',          next: { raise: ['utg_15_vs_3bet'] } },
    hj_15_open:        { label: 'LJ/HJ Open → vs All-in',        next: { raise: ['hj_15_vs_3bet'] } },
    bn_15_open:        { label: 'BN Open → vs All-in',           next: { raise: ['bn_15_vs_3bet'] } },
    sb_15_pfi:         { label: 'SB PFI → Limp vs Iso / All-in', next: { call: ['sb_15_limp_vs_allin', 'sb_15_limp_vs_iso'] } },
    bb_15_vs_sb_limp:  { label: 'BB vs SB Limp → vs Limp/Push',  next: { raise: ['bb_15_vs_sb_limp_push'] } },

    // 25bb (10 chains)
    utg_25_open:       { label: 'UTG Open → vs 3-Bet',           next: { raise: ['utg_25_vs_3bet'] } },
    utg1_25_vs_open:   { label: 'UTG+1 vs Open → vs 4-Bet',      next: { raise: ['utg1_25_vs_4bet'] } },
    hj_25_open:        { label: 'LJ/HJ Open → vs 3-Bet All-in',  next: { raise: ['hj_25_vs_3bet'] } },
    hj_25_vs_open:     { label: 'LJ/HJ vs Open → vs 4-Bet',      next: { raise: ['hj_25_vs_4bet'] } },
    bn_25_open:        { label: 'BN Open → vs BB 3-Bet',         next: { raise: ['bn_25_vs_3bet'] } },
    bn_25_vs_open:     { label: 'BN vs Open → vs 4-Bet',         next: { raise: ['bn_25_vs_4bet'] } },
    sb_25_pfi:         { label: 'SB PFI → Limp/Open vs BB',      next: { call: ['sb_25_limp_vs_allin', 'sb_25_limp_vs_iso'], raise: ['sb_25_open_vs_allin'] } },
    sb_25_vs_open:     { label: 'SB vs UTG Open → vs 4-Bet',     next: { raise: ['sb_25_vs_4bet'] } },
    bb_25_vs_sb_limp:  { label: 'BB vs SB Limp → vs Limp-Push',  next: { raise: ['bb_25_vs_sb_limp_push'] } },
    bb_25_vs_utg_open: { label: 'BB vs UTG Open → vs 4-Bet',     next: { raise: ['bb_25_vs_utg_4bet'] } },

    // 40bb (11 chains)
    utg_40_open:       { label: 'UTG Open → vs 3-Bet',           next: { raise: ['utg_40_vs_3bet'] } },
    utg1_40_vs_open:   { label: 'UTG+1 vs Open → vs 4-Bet',      next: { raise: ['utg1_40_vs_4bet'] } },
    hj_40_open:        { label: 'LJ/HJ Open → vs 3-Bet',         next: { raise: ['hj_40_vs_3bet'] } },
    hj_40_vs_open:     { label: 'LJ/HJ vs Open → vs 4-Bet',      next: { raise: ['hj_40_vs_4bet'] } },
    bn_40_open:        { label: 'BN Open → vs BB 3-Bet',         next: { raise: ['bn_40_vs_3bet'] } },
    bn_40_vs_open:     { label: 'BN vs Open → vs 4-Bet',         next: { raise: ['bn_40_vs_4bet'] } },
    sb_40_pfi:         { label: 'SB PFI → Limp/Open vs BB',      next: { call: ['sb_40_limp_vs_iso'], raise: ['sb_40_open_vs_3bet'] } },
    sb_40_vs_open:     { label: 'SB vs UTG Open → vs 4-Bet',     next: { raise: ['sb_40_vs_4bet'] } },
    bb_40_vs_sb_open:  { label: 'BB vs SB Open → vs 4-Bet',      next: { raise: ['bb_40_vs_sb_4bet'] } },
    bb_40_vs_sb_limp:  { label: 'BB vs SB Limp → vs Limp-Raise', next: { raise: ['bb_40_vs_sb_limp_raise'] } },
    bb_40_vs_utg_open: { label: 'BB vs UTG Open → vs 4-Bet',     next: { raise: ['bb_40_vs_utg_4bet'] } },

    // 60bb (11 chains)
    utg_60_open:       { label: 'UTG Open → vs 3-Bet',           next: { raise: ['utg_60_vs_3bet'] } },
    utg1_60_vs_open:   { label: 'UTG+1 vs Open → vs 4-Bet',      next: { raise: ['utg1_60_vs_4bet'] } },
    hj_60_open:        { label: 'LJ/HJ Open → vs 3-Bet',         next: { raise: ['hj_60_vs_3bet'] } },
    hj_60_vs_open:     { label: 'LJ/HJ vs Open → vs 4-Bet',      next: { raise: ['hj_60_vs_4bet'] } },
    bn_60_open:        { label: 'BN Open → vs BB 3-Bet',         next: { raise: ['bn_60_vs_3bet'] } },
    bn_60_vs_open:     { label: 'BN vs Open → vs 4-Bet',         next: { raise: ['bn_60_vs_4bet'] } },
    sb_60_pfi:         { label: 'SB PFI → Limp/Open vs BB',      next: { call: ['sb_60_limp_vs_iso'], raise: ['sb_60_open_vs_3bet'] } },
    sb_60_vs_open:     { label: 'SB vs UTG Open → vs 4-Bet',     next: { raise: ['sb_60_vs_4bet'] } },
    bb_60_vs_sb_open:  { label: 'BB vs SB Open → vs 4-Bet',      next: { raise: ['bb_60_vs_sb_4bet'] } },
    bb_60_vs_sb_limp:  { label: 'BB vs SB Limp → vs Limp-Raise', next: { raise: ['bb_60_vs_sb_limp_raise'] } },
    bb_60_vs_utg_open: { label: 'BB vs UTG Open → vs 4-Bet',     next: { raise: ['bb_60_vs_utg_4bet'] } }
  };

  const STEP2_TO_STEP1 = {};
  Object.entries(STEP_CHAINS).forEach(([step1Id, cfg]) => {
    Object.values(cfg.next).forEach(arr => {
      arr.forEach(step2Id => { STEP2_TO_STEP1[step2Id] = step1Id; });
    });
  });

  let currentStackKey = '15'; // '15', '25', '40', '60', or 'MIX'
  let currentPosKey   = 'UTG'; // 'UTG', 'HJ', 'BN', 'SB', 'BB', or 'MIX'
  let selectedSpotId  = 'utg_15_open';
  let activeScenario  = SCENARIOS.utg_15_open;
  let lastRenderedScenarioId = null;
  let currentHand = null;
  let answered = false;
  let stats = { correct: 0, total: 0, streak: 0, mistakes: [] };

  // 2-Step Mode state
  let twoStepMode = false;
  let currentStepNum = 1;
  let step1Record = null;
  let completedSteps = []; // [{ scenario, actionCode, actionLabel, chosenFreq, isCorrect, breakdownStr }, ...]
  let activeChartStepView = 1;

  // Hold-to-Peek state
  let isHoldingPeek = false;
  let maskWasCoveredBeforeHold = true;

  function loadTwoStepPref() {
    try {
      twoStepMode = localStorage.getItem('nlh_gto_two_step_mode') === '1';
    } catch (e) {
      twoStepMode = false;
    }
    updateTwoStepToggleUI();
  }

  function updateTwoStepToggleUI() {
    const btn = document.getElementById('twoStepToggle');
    if (btn) btn.classList.toggle('active', twoStepMode);
  }

  function toggleTwoStepMode() {
    twoStepMode = !twoStepMode;
    try {
      localStorage.setItem('nlh_gto_two_step_mode', twoStepMode ? '1' : '0');
    } catch (e) {}
    updateTwoStepToggleUI();
    ensureValidSpotForMode();
    closeAllDropdowns();
    renderDropdownMenus();
    dealNextHand();
  }

  function ensureValidSpotForMode() {
    const spots = getSpotsForCurrentSelection(currentStackKey, currentPosKey);
    if (spots.some(s => s.id === selectedSpotId)) return;

    if (twoStepMode && STEP2_TO_STEP1[selectedSpotId]) {
      const rootId = STEP2_TO_STEP1[selectedSpotId];
      if (spots.some(s => s.id === rootId)) {
        selectedSpotId = rootId;
        return;
      }
    }
    if (spots.length > 0) {
      selectedSpotId = spots[0].id;
    }
  }

  function getChainKeys(filterFn) {
    return Object.keys(STEP_CHAINS).filter(k => SCENARIOS[k] && (!filterFn || filterFn(SCENARIOS[k])));
  }

  function getSpotsForCurrentSelection(stackKey, posKey) {
    if (!twoStepMode) {
      if (stackKey === '15' || stackKey === '25' || stackKey === '40' || stackKey === '60') {
        return SPOTS_BY_STACK_AND_POS[stackKey][posKey];
      }
      // stackKey === 'MIX'
      if (posKey === 'MIX') {
        return [
          { id: 'mix_all_87',  label: '🔥 All 87 Spots (15, 25, 40 & 60bb)', tag: '87 Charts' },
          { id: 'mix_15_all',  label: '🎲 All 15bb Spots',                   tag: '17 Charts' },
          { id: 'mix_25_all',  label: '🎲 All 25bb Spots',                   tag: '24 Charts' },
          { id: 'mix_40_all',  label: '🎲 All 40bb Spots',                   tag: '23 Charts' },
          { id: 'mix_60_all',  label: '🎲 All 60bb Spots',                   tag: '23 Charts' },
          { id: 'mix_all_UTG', label: '🎲 Mix UTG (All Stacks)',             tag: '15 Charts' },
          { id: 'mix_all_HJ',  label: '🎲 Mix LJ/HJ (All Stacks)',           tag: '15 Charts' },
          { id: 'mix_all_BN',  label: '🎲 Mix CO/BN (All Stacks)',           tag: '15 Charts' },
          { id: 'mix_all_SB',  label: '🎲 Mix SB (All Stacks)',              tag: '20 Charts' },
          { id: 'mix_all_BB',  label: '🎲 Mix BB (All Stacks)',              tag: '22 Charts' }
        ];
      }
      const list15 = SPOTS_BY_STACK_AND_POS['15'][posKey].filter(s => !s.id.startsWith('mix_'));
      const list25 = SPOTS_BY_STACK_AND_POS['25'][posKey].filter(s => !s.id.startsWith('mix_'));
      const list40 = SPOTS_BY_STACK_AND_POS['40'][posKey].filter(s => !s.id.startsWith('mix_'));
      const list60 = SPOTS_BY_STACK_AND_POS['60'][posKey].filter(s => !s.id.startsWith('mix_'));
      return [
        { id: `mix_all_${posKey}`, label: `🎲 Mix ${posKey} (15, 25, 40 & 60bb)`, tag: 'Mix All' },
        ...list15,
        ...list25,
        ...list40,
        ...list60
      ];
    }

    // 2-STEP MODE SPOT OPTIONS
    const toChainItem = (id, idx) => ({
      id,
      label: `${idx + 1}. ${STEP_CHAINS[id].label}`,
      tag: `${SCENARIOS[id].stack}bb`
    });

    if (stackKey === '15' || stackKey === '25' || stackKey === '40' || stackKey === '60') {
      if (posKey === 'MIX') {
        const total = getChainKeys(s => s.stack === stackKey).length;
        const items = [{ id: `mix_${stackKey}_all`, label: `🔥 All ${total} Chains (${stackKey}bb)`, tag: `${total} Chains` }];
        ['UTG', 'HJ', 'BN', 'SB', 'BB'].forEach(grp => {
          const cnt = getChainKeys(s => s.stack === stackKey && s.group === grp).length;
          if (cnt > 0) {
            const grpName = grp === 'HJ' ? 'LJ/HJ' : grp === 'BN' ? 'CO/BN' : grp;
            items.push({ id: `mix_${stackKey}_${grp.toLowerCase()}`, label: `🎲 Mix ${grpName} (${stackKey}bb)`, tag: `${cnt} ${cnt === 1 ? 'Chain' : 'Chains'}` });
          }
        });
        return items;
      }

      const chainIds = SPOTS_BY_STACK_AND_POS[stackKey][posKey]
        .filter(s => !s.id.startsWith('mix_') && STEP_CHAINS[s.id])
        .map(s => s.id);
      const list = chainIds.map((id, i) => toChainItem(id, i));
      if (chainIds.length > 1) {
        const grpName = posKey === 'HJ' ? 'LJ/HJ' : posKey === 'BN' ? 'CO/BN' : posKey;
        list.push({ id: `mix_${stackKey}_${posKey.toLowerCase()}`, label: `🎲 Mix ${grpName} (${stackKey}bb)`, tag: 'Mix' });
      }
      return list;
    }

    // stackKey === 'MIX' in 2-Step mode
    if (posKey === 'MIX') {
      const totalAll = getChainKeys().length;
      const items = [
        { id: 'mix_all_87', label: `🔥 All ${totalAll} Chains (15, 25, 40 & 60bb)`, tag: `${totalAll} Chains` }
      ];
      ['15', '25', '40', '60'].forEach(st => {
        const cnt = getChainKeys(s => s.stack === st).length;
        items.push({ id: `mix_${st}_all`, label: `🎲 All ${st}bb Chains`, tag: `${cnt} Chains` });
      });
      ['UTG', 'HJ', 'BN', 'SB', 'BB'].forEach(grp => {
        const cnt = getChainKeys(s => s.group === grp).length;
        const grpName = grp === 'HJ' ? 'LJ/HJ' : grp === 'BN' ? 'CO/BN' : grp;
        items.push({ id: `mix_all_${grp}`, label: `🎲 Mix ${grpName} (All Stacks)`, tag: `${cnt} Chains` });
      });
      return items;
    }

    // Specific position with MIX stack depth in 2-Step mode
    const allPosChains = [];
    ['15', '25', '40', '60'].forEach(st => {
      SPOTS_BY_STACK_AND_POS[st][posKey]
        .filter(s => !s.id.startsWith('mix_') && STEP_CHAINS[s.id])
        .forEach(s => allPosChains.push(s.id));
    });
    const grpName = posKey === 'HJ' ? 'LJ/HJ' : posKey === 'BN' ? 'CO/BN' : posKey;
    return [
      { id: `mix_all_${posKey}`, label: `🎲 Mix ${grpName} (All Stacks)`, tag: `${allPosChains.length} Chains` },
      ...allPosChains.map((id, i) => toChainItem(id, i))
    ];
  }

  function mapSpotBetweenStacks(oldSpotId, targetStack, posKey) {
    if (targetStack === 'MIX') {
      return posKey === 'MIX' ? 'mix_all_87' : `mix_all_${posKey}`;
    }
    if (posKey === 'MIX') {
      return `mix_${targetStack}_all`;
    }
    if (oldSpotId.startsWith('mix_')) {
      const targetMix = `mix_${targetStack}_${posKey.toLowerCase()}`;
      const spots = getSpotsForCurrentSelection(targetStack, posKey);
      if (spots.some(s => s.id === targetMix)) return targetMix;
      return spots[0].id;
    }

    // Replace stack token _(15|25|40|60)_ with _targetStack_
    let candidate = oldSpotId.replace(/_(15|25|40|60)_/, `_${targetStack}_`);
    const isAllowed = id => SCENARIOS[id] && SCENARIOS[id].group === posKey && (!twoStepMode || !!STEP_CHAINS[id]);

    if (isAllowed(candidate)) {
      return candidate;
    }

    // Handle naming equivalents between 15/25bb and 40/60bb
    const equivalents = {
      [`sb_${targetStack}_open_vs_allin`]: `sb_${targetStack}_open_vs_3bet`,
      [`sb_${targetStack}_open_vs_3bet`]:  `sb_${targetStack}_open_vs_allin`,
      [`bb_${targetStack}_vs_sb_limp_push`]:  `bb_${targetStack}_vs_sb_limp_raise`,
      [`bb_${targetStack}_vs_sb_limp_raise`]: `bb_${targetStack}_vs_sb_limp_push`
    };

    if (equivalents[candidate] && isAllowed(equivalents[candidate])) {
      return equivalents[candidate];
    }

    const available = getSpotsForCurrentSelection(targetStack, posKey);
    return available[0].id;
  }

  function toggleDropdown(type, event) {
    if (event) event.stopPropagation();
    const wraps = {
      pos: document.getElementById('wrapPos'),
      stack: document.getElementById('wrapStack'),
      spot: document.getElementById('wrapSpot')
    };
    const targetWrap = wraps[type];
    const isOpen = targetWrap.classList.contains('open');

    Object.values(wraps).forEach(w => w.classList.remove('open'));
    if (!isOpen) {
      renderDropdownMenus();
      targetWrap.classList.add('open');
    }
  }

  function closeAllDropdowns() {
    document.querySelectorAll('.badge-dropdown-wrap').forEach(w => w.classList.remove('open'));
  }

  window.addEventListener('click', (e) => {
    if (!e.target.closest('.badge-dropdown-wrap')) {
      closeAllDropdowns();
    }
  });

  function renderDropdownMenus() {
    const unitLabel = (n) => twoStepMode ? (n === 1 ? '1 Chain' : `${n} Chains`) : `${n} Spots`;
    const stackUnitLabel = (n) => twoStepMode ? `${n} Chains` : `${n} Charts`;

    // 1. Position Menu
    const menuPos = document.getElementById('menuPos');
    menuPos.innerHTML = POSITIONS.map(p => {
      const countFor = (st) => {
        if (twoStepMode) {
          return getChainKeys(s => s.stack === st && (p.key === 'MIX' || s.group === p.key)).length;
        }
        return Object.values(SCENARIOS).filter(s => s.stack === st && (p.key === 'MIX' || s.group === p.key)).length;
      };
      const c15 = countFor('15'), c25 = countFor('25'), c40 = countFor('40'), c60 = countFor('60');
      const cnt = currentStackKey === '15' ? c15
                : currentStackKey === '25' ? c25
                : currentStackKey === '40' ? c40
                : currentStackKey === '60' ? c60
                : (c15 + c25 + c40 + c60);
      return `
        <button type="button" class="menu-option ${currentPosKey === p.key ? 'active' : ''}" onclick="selectPos('${p.key}', event)">
          <span>${p.label}</span>
          <span class="menu-option-tag">${unitLabel(cnt)}</span>
        </button>
      `;
    }).join('');

    // 2. Stack Depth Menu
    const menuStack = document.getElementById('menuStack');
    menuStack.innerHTML = STACKS.map(st => {
      let cnt;
      if (twoStepMode) {
        cnt = st.key === 'MIX' ? getChainKeys().length : getChainKeys(s => s.stack === st.key).length;
      } else {
        cnt = st.key === 'MIX' ? Object.keys(SCENARIOS).length : Object.values(SCENARIOS).filter(s => s.stack === st.key).length;
      }
      return `
        <button type="button" class="menu-option ${currentStackKey === st.key ? 'active' : ''}" onclick="selectStack('${st.key}', event)">
          <span>${st.label}</span>
          <span class="menu-option-tag">${stackUnitLabel(cnt)}</span>
        </button>
      `;
    }).join('');

    // 3. Scenario Spot Menu
    const menuSpot = document.getElementById('menuSpot');
    const spots = getSpotsForCurrentSelection(currentStackKey, currentPosKey);
    menuSpot.innerHTML = spots.map(sp => `
      <button type="button" class="menu-option ${selectedSpotId === sp.id ? 'active' : ''}" onclick="selectSpot('${sp.id}', event)">
        <span>${sp.label}</span>
        <span class="menu-option-tag">${sp.tag || ''}</span>
      </button>
    `).join('');
  }

  function selectPos(posKey, event) {
    if (event) event.stopPropagation();
    currentPosKey = posKey;
    const spots = getSpotsForCurrentSelection(currentStackKey, currentPosKey);
    selectedSpotId = spots[0].id;
    closeAllDropdowns();
    dealNextHand();
  }

  function selectStack(stackKey, event) {
    if (event) event.stopPropagation();
    currentStackKey = stackKey;
    selectedSpotId = mapSpotBetweenStacks(selectedSpotId, currentStackKey, currentPosKey);
    closeAllDropdowns();
    dealNextHand();
  }

  function selectSpot(spotId, event) {
    if (event) event.stopPropagation();
    selectedSpotId = spotId;
    closeAllDropdowns();
    dealNextHand();
  }

  function resolveScenarioFromSpot(spotId) {
    const poolKeys = twoStepMode ? Object.keys(STEP_CHAINS) : Object.keys(SCENARIOS);
    const pick = arr => {
      if (!arr || arr.length === 0) return SCENARIOS[poolKeys[0]];
      return SCENARIOS[arr[Math.floor(Math.random() * arr.length)]];
    };

    if (spotId === 'mix_all_87') return pick(poolKeys);
    if (spotId === 'mix_15_all') return pick(poolKeys.filter(k => SCENARIOS[k].stack === '15'));
    if (spotId === 'mix_25_all') return pick(poolKeys.filter(k => SCENARIOS[k].stack === '25'));
    if (spotId === 'mix_40_all') return pick(poolKeys.filter(k => SCENARIOS[k].stack === '40'));
    if (spotId === 'mix_60_all') return pick(poolKeys.filter(k => SCENARIOS[k].stack === '60'));

    const matchAllStacksPos = spotId.match(/^mix_all_(UTG|HJ|BN|SB|BB)$/);
    if (matchAllStacksPos) {
      const grp = matchAllStacksPos[1];
      return pick(poolKeys.filter(k => SCENARIOS[k].group === grp));
    }

    const matchSingleStackPos = spotId.match(/^mix_(15|25|40|60)_(utg|hj|bn|sb|bb)$/);
    if (matchSingleStackPos) {
      const st = matchSingleStackPos[1];
      const grp = matchSingleStackPos[2].toUpperCase();
      return pick(poolKeys.filter(k => SCENARIOS[k].stack === st && SCENARIOS[k].group === grp));
    }

    if (twoStepMode && !STEP_CHAINS[spotId]) {
      if (STEP2_TO_STEP1[spotId]) return SCENARIOS[STEP2_TO_STEP1[spotId]];
      return pick(poolKeys);
    }

    return SCENARIOS[spotId] || SCENARIOS.utg_15_open;
  }

  function getHandBreakdown(scenario, hand) {
    const entry = scenario.raw[hand];
    if (!entry) {
      if (scenario.isConditional) return null;
      return { allin: 0, raise: 0, call: 0, fold: 100 };
    }
    const allin = entry.allin || 0;
    const raise = entry.raise || 0;
    const call  = entry.call  || 0;
    const used = allin + raise + call;
    const fold = entry.fold !== undefined ? entry.fold : Math.max(0, 100 - used);
    return { allin, raise, call, fold };
  }

  function renderChartPanel(scenario, highlightHand = null) {
    document.getElementById('chartTitle').textContent = scenario.title;

    const legEl = document.getElementById('chartLegend');
    legEl.innerHTML = scenario.legend.map(item => `
      <div class="legend-item">
        <div class="legend-swatch" style="background:${item.color};"></div>
        <span>${item.label}</span>
      </div>
    `).join('');

    if (lastRenderedScenarioId !== scenario.id) {
      lastRenderedScenarioId = scenario.id;
      const grid = document.getElementById('matrixGrid');
      grid.innerHTML = '';

      ALL_169_HANDS.forEach(hand => {
        const cell = document.createElement('div');
        cell.id = `cell-${hand}`;
        const dist = getHandBreakdown(scenario, hand);

        if (!dist) {
          cell.className = 'matrix-cell unused-cell';
          cell.innerHTML = `<span>${hand}</span>`;
        } else {
          cell.className = 'matrix-cell';
          const bars = document.createElement('div');
          bars.className = 'cell-bars';

          if (dist.allin > 0) {
            const b = document.createElement('div');
            b.className = 'bar-allin';
            b.style.width = `${dist.allin}%`;
            bars.appendChild(b);
          }
          if (dist.raise > 0) {
            const b = document.createElement('div');
            b.className = 'bar-raise';
            b.style.width = `${dist.raise}%`;
            bars.appendChild(b);
          }
          if (dist.call > 0) {
            const b = document.createElement('div');
            b.className = 'bar-call';
            b.style.width = `${dist.call}%`;
            bars.appendChild(b);
          }
          if (dist.fold > 0) {
            const b = document.createElement('div');
            b.className = 'bar-fold';
            b.style.width = `${dist.fold}%`;
            bars.appendChild(b);
          }

          cell.appendChild(bars);
          const label = document.createElement('span');
          label.textContent = hand;
          cell.appendChild(label);
        }

        grid.appendChild(cell);
      });
    } else {
      document.querySelectorAll('.matrix-cell.active-hand').forEach(el => el.classList.remove('active-hand'));
    }

    if (highlightHand) {
      const activeCell = document.getElementById(`cell-${highlightHand}`);
      if (activeCell) activeCell.classList.add('active-hand');
    }
  }

  function updateFeltBanner(scenario) {
    const bannerEl = document.getElementById('feltBanner');
    bannerEl.classList.remove('step2-active', 'step-pulse');

    if (twoStepMode && (STEP_CHAINS[scenario.id] || currentStepNum === 2)) {
      const pillCls = currentStepNum === 2 ? 'step-2' : 'step-1';
      const pillText = currentStepNum === 2 ? 'STEP 2/2' : 'STEP 1/2';
      bannerEl.innerHTML = `<span class="step-pill ${pillCls}">${pillText}</span><span>${scenario.banner}</span>`;
      if (currentStepNum === 2) {
        bannerEl.classList.add('step2-active');
        void bannerEl.offsetWidth;
        bannerEl.classList.add('step-pulse');
      }
    } else {
      bannerEl.textContent = scenario.banner;
    }
  }

  function buildScenarioUI(scenario) {
    document.getElementById('badgePos').textContent = scenario.pos;
    document.getElementById('badgeStack').textContent = `${scenario.stack} BB`;
    document.getElementById('badgeSpot').textContent = scenario.spot;

    // Show/hide mix mini pills on the 3 boxes when Mix is active
    document.getElementById('mixPillPos').classList.toggle('visible', currentPosKey === 'MIX');
    document.getElementById('mixPillStack').classList.toggle('visible', currentStackKey === 'MIX');
    document.getElementById('mixPillSpot').classList.toggle('visible', selectedSpotId.startsWith('mix_'));

    updateFeltBanner(scenario);

    const btnContainer = document.getElementById('actionButtonsContainer');
    btnContainer.innerHTML = scenario.actions.map(act => `
      <button class="act-btn ${act.cls}" id="actbtn-${act.code}" onclick="submitAction('${act.code}')">
        <span class="act-title">${act.label}</span>
      </button>
    `).join('');

    renderChartPanel(scenario, null);
  }

  function hideChartStepTabs() {
    const tabsEl = document.getElementById('chartStepTabs');
    if (tabsEl) tabsEl.classList.remove('visible');
  }

  function showChartStepTabs(defaultStep) {
    const tabsEl = document.getElementById('chartStepTabs');
    const tab1 = document.getElementById('tabStep1');
    const tab2 = document.getElementById('tabStep2');
    if (!tabsEl || !tab1 || !tab2 || completedSteps.length < 2) return;

    const s1 = completedSteps[0];
    const s2 = completedSteps[1];
    tab1.textContent = `Step 1 ${s1.isCorrect ? '✓' : '✗'}`;
    tab2.textContent = `Step 2 ${s2.isCorrect ? '✓' : '✗'}`;
    tab1.className = `chart-step-tab ${s1.isCorrect ? 'tab-ok' : 'tab-err'}`;
    tab2.className = `chart-step-tab ${s2.isCorrect ? 'tab-ok' : 'tab-err'}`;
    tabsEl.classList.add('visible');
    viewChartStep(defaultStep);
  }

  function viewChartStep(stepIndex) {
    if (completedSteps.length < 2) return;
    const rec = completedSteps[stepIndex - 1];
    if (!rec) return;

    activeChartStepView = stepIndex;
    const tab1 = document.getElementById('tabStep1');
    const tab2 = document.getElementById('tabStep2');
    if (tab1) tab1.classList.toggle('active', stepIndex === 1);
    if (tab2) tab2.classList.toggle('active', stepIndex === 2);

    renderChartPanel(rec.scenario, currentHand);
  }

  function pickHandNotation(scenario) {
    const mode = document.getElementById('drillMode').value;
    const eligibleHands = scenario.isConditional
      ? Object.keys(scenario.raw)
      : ALL_169_HANDS;

    if (mode === 'borderline') {
      return scenario.borderline[Math.floor(Math.random() * scenario.borderline.length)];
    } else if (mode === 'smart') {
      if (Math.random() < 0.65) {
        return scenario.borderline[Math.floor(Math.random() * scenario.borderline.length)];
      }
    }
    return eligibleHands[Math.floor(Math.random() * eligibleHands.length)];
  }

  function renderPlayingCard(elId, rank, suitObj) {
    const card = document.getElementById(elId);
    card.className = `playing-card ${suitObj.cls}`;
    card.innerHTML = `
      <div class="corner-rank">${rank}</div>
      <div class="center-suit">${suitObj.symbol}</div>
      <div class="bottom-rank">${rank}</div>
    `;
  }

  function dealNextHand() {
    answered = false;
    currentStepNum = 1;
    step1Record = null;
    completedSteps = [];
    activeChartStepView = 1;
    isHoldingPeek = false;
    maskWasCoveredBeforeHold = true;
    hideChartStepTabs();

    activeScenario = resolveScenarioFromSpot(selectedSpotId);

    buildScenarioUI(activeScenario);
    document.getElementById('matrixMask').classList.remove('hidden');

    const notation = pickHandNotation(activeScenario);
    currentHand = notation;

    const r1 = notation[0];
    const r2 = notation[1];
    const idx1 = Math.floor(Math.random() * 4);
    const idx2 = (idx1 + 1 + Math.floor(Math.random() * 3)) % 4;
    const s1 = SUITS[idx1];
    const s2 = (notation.length === 3 && notation[2] === 's') ? s1 : SUITS[idx2];

    renderPlayingCard('card1', r1, s1);
    renderPlayingCard('card2', r2, s2);
    document.getElementById('handNotation').textContent = notation;

    const fbBox = document.getElementById('feedbackBox');
    fbBox.className = 'feedback-box';
    document.getElementById('feedbackTitle').textContent = '';
    document.getElementById('feedbackDesc').textContent = '';
    document.getElementById('nextBtn').style.display = 'none';
  }

  function formatBreakdownText(dist, scenario = activeScenario) {
    const parts = [];
    let callLabel = 'Call';
    let raiseLabel = scenario.stack === '15' ? 'Raise 2x' : 'Raise/3B/4B';

    if (scenario.id === 'sb_15_pfi') {
      callLabel = 'Limp';
      raiseLabel = 'All-in';
    } else if (scenario.id === 'sb_25_pfi') {
      callLabel = 'Limp';
      raiseLabel = 'Raise 3.3x';
    } else if (['sb_40_pfi', 'sb_60_pfi'].includes(scenario.id)) {
      callLabel = 'Limp';
      raiseLabel = 'Raise 3.5x';
    } else if (['sb_15_limp_vs_iso', 'sb_25_limp_vs_iso'].includes(scenario.id)) {
      raiseLabel = 'Raise All-in';
    } else if (scenario.id === 'sb_40_limp_vs_iso') {
      raiseLabel = 'Raise 2.75x';
    } else if (scenario.id === 'sb_60_limp_vs_iso') {
      raiseLabel = 'Raise 3.4x';
    } else if (scenario.id === 'bb_15_vs_sb_limp') {
      callLabel = 'Check';
      raiseLabel = 'Raise 3x';
    } else if (scenario.id === 'bb_25_vs_sb_limp') {
      callLabel = 'Check';
      raiseLabel = 'Raise 3.3x';
    } else if (['bb_40_vs_sb_limp', 'bb_60_vs_sb_limp'].includes(scenario.id)) {
      callLabel = 'Check';
      raiseLabel = 'Raise 3.5x';
    } else if ([
      'utg_15_vs_3bet', 'hj_15_vs_3bet', 'bn_15_vs_3bet',
      'sb_15_limp_vs_allin', 'bb_15_vs_sb_limp_push',
      'hj_25_vs_3bet', 'sb_25_limp_vs_allin', 'sb_25_open_vs_allin'
    ].includes(scenario.id)) {
      callLabel = 'Call All-in';
    }

    if (dist.allin > 0) parts.push(`All-in: ${dist.allin}%`);
    if (dist.raise > 0) parts.push(`${raiseLabel}: ${dist.raise}%`);
    if (dist.call > 0)  parts.push(`${callLabel}: ${dist.call}%`);
    if (dist.fold > 0)  parts.push(`Fold: ${dist.fold}%`);
    return parts.join(' • ');
  }

  function findNextStepScenario(step1Scenario, actionCode, hand) {
    if (!twoStepMode) return null;
    const cfg = STEP_CHAINS[step1Scenario.id];
    if (!cfg || !cfg.next || !cfg.next[actionCode]) return null;

    const candidates = cfg.next[actionCode].filter(id => {
      const sc = SCENARIOS[id];
      return sc && getHandBreakdown(sc, hand) !== null;
    });
    if (candidates.length === 0) return null;

    const chosenId = candidates[Math.floor(Math.random() * candidates.length)];
    return SCENARIOS[chosenId];
  }

  function submitAction(actionCode) {
    if (answered) return;

    const dist = getHandBreakdown(activeScenario, currentHand);
    if (!dist) return;
    const chosenFreq = dist[actionCode] || 0;
    const isCorrect = chosenFreq > 0;
    const breakdownStr = formatBreakdownText(dist, activeScenario);
    const chosenActObj = activeScenario.actions.find(a => a.code === actionCode);
    const chosenLabel = chosenActObj ? chosenActObj.label : actionCode.toUpperCase();

    const currentRecord = {
      scenario: activeScenario,
      actionCode,
      actionLabel: chosenLabel,
      chosenFreq,
      isCorrect,
      breakdownStr
    };

    // STEP 1 -> Check if we should transition to STEP 2 (only if Step 1 is correct!)
    if (twoStepMode && currentStepNum === 1 && isCorrect) {
      const nextScenario = findNextStepScenario(activeScenario, actionCode, currentHand);
      if (nextScenario) {
        step1Record = currentRecord;
        currentStepNum = 2;
        activeScenario = nextScenario;
        isHoldingPeek = false;
        maskWasCoveredBeforeHold = true;

        try {
          if (navigator.vibrate) navigator.vibrate(15);
        } catch (e) {}

        buildScenarioUI(activeScenario);
        document.getElementById('matrixMask').classList.remove('hidden');
        return;
      }
    }

    // FINALIZE HAND (either single-step hand, Step 1 error/terminal action, or Step 2 completion)
    answered = true;
    maskWasCoveredBeforeHold = false;

    const isTwoStepCompleted = (currentStepNum === 2 && step1Record !== null);
    completedSteps = isTwoStepCompleted ? [step1Record, currentRecord] : [currentRecord];

    const overallCorrect = completedSteps.every(s => s.isCorrect);

    try {
      if (navigator.vibrate) {
        navigator.vibrate(overallCorrect ? 25 : [50, 40, 50]);
      }
    } catch (e) {}

    stats.total++;
    if (overallCorrect) {
      stats.correct++;
      stats.streak++;
    } else {
      stats.streak = 0;
      if (!Array.isArray(stats.mistakes)) stats.mistakes = [];
      const failedStep = completedSteps.find(s => !s.isCorrect) || currentRecord;
      const mistakeSpotLabel = isTwoStepCompleted
        ? `${step1Record.scenario.spot} (${step1Record.actionLabel} ✓) → ${failedStep.scenario.spot}`
        : failedStep.scenario.spot;

      stats.mistakes.unshift({
        hand: currentHand,
        pos: failedStep.scenario.pos,
        stack: failedStep.scenario.stack,
        spot: mistakeSpotLabel,
        title: failedStep.scenario.title,
        chosen: failedStep.actionLabel,
        gto: failedStep.breakdownStr
      });
    }
    saveStats();

    const fbBox = document.getElementById('feedbackBox');
    const fbIcon = document.getElementById('feedbackIcon');
    const fbTitle = document.getElementById('feedbackTitle');
    const fbDesc = document.getElementById('feedbackDesc');

    if (isTwoStepCompleted) {
      const s1 = completedSteps[0];
      const s2 = completedSteps[1];
      if (overallCorrect) {
        fbBox.className = 'feedback-box correct';
        fbIcon.className = 'feedback-icon icon-correct';
        fbIcon.textContent = '✓';
        fbTitle.textContent = `2-STEP CORRECT! (${currentHand})`;
      } else {
        fbBox.className = 'feedback-box wrong';
        fbIcon.className = 'feedback-icon icon-wrong';
        fbIcon.textContent = '✗';
        fbTitle.textContent = `STEP 2 INCORRECT! (${currentHand})`;
      }
      fbDesc.textContent = `S1: ${s1.actionLabel} ✓ (${s1.chosenFreq}%) • S2: [ ${s2.breakdownStr} ]`;
    } else {
      if (overallCorrect) {
        fbBox.className = 'feedback-box correct';
        fbIcon.className = 'feedback-icon icon-correct';
        fbIcon.textContent = '✓';
        fbTitle.textContent = chosenFreq === 100
          ? `CORRECT! Pure 100% (${currentHand})`
          : `CORRECT! Mixed (${chosenFreq}%) — ${currentHand}`;
      } else {
        fbBox.className = 'feedback-box wrong';
        fbIcon.className = 'feedback-icon icon-wrong';
        fbIcon.textContent = '✗';
        fbTitle.textContent = `INCORRECT! (${currentHand})`;
      }
      fbDesc.textContent = `${currentHand}: [ ${breakdownStr} ]`;
    }

    document.getElementById('nextBtn').style.display = 'block';
    document.getElementById('matrixMask').classList.add('hidden');

    if (isTwoStepCompleted) {
      // Default tab: mistake step if any, else Step 2
      const defaultTab = !completedSteps[0].isCorrect ? 1 : 2;
      showChartStepTabs(defaultTab);
    } else {
      hideChartStepTabs();
      renderChartPanel(activeScenario, currentHand);
    }

    document.querySelectorAll('.act-btn').forEach(b => b.disabled = true);
  }

  function togglePeek() {
    const mask = document.getElementById('matrixMask');
    mask.classList.toggle('hidden');
    maskWasCoveredBeforeHold = !mask.classList.contains('hidden');
  }

  function startHoldPeek() {
    if (!isHoldingPeek) {
      isHoldingPeek = true;
      const mask = document.getElementById('matrixMask');
      maskWasCoveredBeforeHold = !mask.classList.contains('hidden');
      mask.classList.add('hidden');
    }
  }

  function endHoldPeek() {
    if (isHoldingPeek) {
      isHoldingPeek = false;
      const mask = document.getElementById('matrixMask');
      if (maskWasCoveredBeforeHold) {
        mask.classList.remove('hidden');
      }
    }
  }

  const matrixWrapper = document.getElementById('matrixWrapper');
  matrixWrapper.addEventListener('touchstart', (e) => {
    if (!answered) {
      e.preventDefault();
      startHoldPeek();
    }
  }, { passive: false });
  matrixWrapper.addEventListener('touchend', endHoldPeek);
  matrixWrapper.addEventListener('touchcancel', endHoldPeek);
  matrixWrapper.addEventListener('mousedown', () => { if (!answered) startHoldPeek(); });
  window.addEventListener('mouseup', endHoldPeek);

  function loadStats() {
    try {
      const saved = localStorage.getItem('nlh_gto_merged_15_25_40_60_stats');
      if (saved) {
        const parsed = JSON.parse(saved);
        stats = {
          correct: parsed.correct || 0,
          total: parsed.total || 0,
          streak: parsed.streak || 0,
          mistakes: Array.isArray(parsed.mistakes) ? parsed.mistakes : []
        };
      }
    } catch (e) {}
    updateStatsUI();
  }

  function saveStats() {
    try {
      localStorage.setItem('nlh_gto_merged_15_25_40_60_stats', JSON.stringify(stats));
    } catch (e) {}
    updateStatsUI();
  }

  function resetStats() {
    stats = { correct: 0, total: 0, streak: 0, mistakes: [] };
    saveStats();
    renderMistakesModal();
  }

  function openMistakesModal() {
    renderMistakesModal();
    document.getElementById('mistakesModalOverlay').classList.add('open');
  }

  function closeMistakesModal() {
    document.getElementById('mistakesModalOverlay').classList.remove('open');
  }

  function handleMistakesOverlayClick(event) {
    if (event.target.id === 'mistakesModalOverlay') {
      closeMistakesModal();
    }
  }

  function renderMistakesModal() {
    const list = Array.isArray(stats.mistakes) ? stats.mistakes : [];
    const badge = document.getElementById('mistakesCountBadge');
    const depthBar = document.getElementById('mistakesDepthBar');
    const body = document.getElementById('mistakesModalBody');
    if (!badge || !body || !depthBar) return;

    const totalMistakes = list.length;
    badge.textContent = totalMistakes;

    const depths = ['15', '25', '40', '60'];
    depthBar.innerHTML = depths.map(d => {
      const count = list.filter(m => String(m.stack) === d).length;
      const pct = totalMistakes > 0 ? Math.round((count / totalMistakes) * 100) : 0;
      return `
        <div class="depth-stat-card">
          <span class="depth-stat-label">${d} BB Mistakes</span>
          <span class="depth-stat-val">${pct}%</span>
          <span class="depth-stat-count">${count} / ${totalMistakes}</span>
        </div>
      `;
    }).join('');

    if (totalMistakes === 0) {
      body.innerHTML = '<div class="mistakes-empty">No mistakes recorded yet.</div>';
      return;
    }

    body.innerHTML = list.map(m => `
      <div class="mistake-item">
        <div class="mistake-top-row">
          <div class="mistake-hand-wrap">
            <span class="mistake-hand-badge">${m.hand}</span>
            <span class="mistake-spot-info">${m.pos} • ${m.spot}</span>
          </div>
          <span class="mistake-stack-tag">${m.stack} BB</span>
        </div>
        <div class="mistake-details-row">
          <span class="mistake-user-choice">✗ Your Action: ${m.chosen}</span>
          <span class="mistake-gto-correct">✓ GTO: [ ${m.gto} ]</span>
        </div>
      </div>
    `).join('');
  }

  function updateStatsUI() {
    document.getElementById('scoreText').textContent = `${stats.correct}/${stats.total}`;
    const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
    document.getElementById('accText').textContent = `${acc}%`;
    document.getElementById('streakText').textContent = stats.streak;
  }

  window.addEventListener('keydown', (e) => {
    const mistakesOverlay = document.getElementById('mistakesModalOverlay');
    if (mistakesOverlay && mistakesOverlay.classList.contains('open')) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeMistakesModal();
      }
      return;
    }
    if (e.code === 'Backquote' || e.key === '`') {
      e.preventDefault();
      startHoldPeek();
      return;
    }
    if (e.key === 'Escape') {
      closeAllDropdowns();
      return;
    }

    const key = e.key.toLowerCase();
    if (!answered) {
      const acts = activeScenario.actions;
      if (key === '1' && acts[0]) submitAction(acts[0].code);
      else if (key === '2' && acts[1]) submitAction(acts[1].code);
      else if (key === '3' && acts[2]) submitAction(acts[2].code);
      else if (key === '4' && acts[3]) submitAction(acts[3].code);
      else if (key === 'f' && acts.some(a => a.code === 'fold')) submitAction('fold');
      else if (key === 'c' && acts.some(a => a.code === 'call')) submitAction('call');
      else if (key === 'r' && acts.some(a => a.code === 'raise')) submitAction('raise');
      else if (key === 'a') {
        if (acts.some(a => a.code === 'allin')) submitAction('allin');
        else if (['sb_15_pfi', 'sb_15_limp_vs_iso', 'sb_25_limp_vs_iso'].includes(activeScenario.id)) submitAction('raise');
      }
    } else {
      if (key === ' ' || key === 'enter') {
        e.preventDefault();
        dealNextHand();
      } else if (completedSteps.length === 2) {
        if (e.key === 'ArrowLeft' || key === '1') {
          e.preventDefault();
          viewChartStep(1);
        } else if (e.key === 'ArrowRight' || key === '2') {
          e.preventDefault();
          viewChartStep(2);
        }
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Backquote' || e.key === '`') {
      e.preventDefault();
      endHoldPeek();
    }
  });

  function initApp() {
    loadStats();
    loadTwoStepPref();
    ensureValidSpotForMode();
    renderDropdownMenus();
    dealNextHand();
  }

  initApp();
</script>
</body>
</html>
